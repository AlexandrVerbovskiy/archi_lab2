name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v2
      
    - name: Set up .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '6.0'
      
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Apply FluentMigrator migrations
      run: dotnet run --project ./Migrations --migrate

    - name: Apply FluentMigrator seeders
      run: dotnet run --project ./Seeders --migrate

    - name: Build project
      run: dotnet build --configuration Release
